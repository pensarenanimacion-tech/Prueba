<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Izquierda - Juego</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { margin: 0; background: #0f172a; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
    .hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; pointer-events: none; }
    .pill { background: #1e293b; padding: 6px 10px; border-radius: 6px; }
    button { pointer-events: auto; background: #0284c7; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="pill">Sala fija | <span id="st">Esperando</span></div>
    <div class="pill">Puntos: <span id="pts">0</span></div>
    <button id="btnSensor" style="display:none;">Activar movimiento</button>
  </div>
  <canvas id="c"></canvas>
  <script>
    const SALA_ID = "circulo-sala-1";
    const c = document.getElementById("c"), ctx = c.getContext("2d");
    function resize() { c.width = innerWidth; c.height = innerHeight; }
    resize();
    addEventListener("resize", resize);

    const r = 22;
    let conn = null;
    let puntos = 0;
    let flash = 0;

    // Círculo activo en este celular (si ball === null, está en el otro celular)
    let ball = {
      x: c.width * 0.35,
      y: c.height * 0.5,
      vx: 260,
      vy: 190
    };

    function sumarPunto() {
      puntos++;
      document.getElementById("pts").textContent = puntos;
    }

    function golpearDesdeMovimiento(ax, ay) {
      flash = 0.25;
      if (!ball) {
        // Si el balón está en el otro celular, le avisamos para que choque/rebote allá
        if (conn && conn.open) {
          conn.send({ type: "GOLPE", ax, ay });
        }
        return;
      }

      // Impulsa o hace rebotar el círculo desde su punto actual
      const mag = Math.min(900, Math.hypot(ax, ay) * 45);
      const boost = Math.max(280, mag);

      ball.vx = (ax >= 0 ? 1 : -1) * Math.max(240, Math.abs(ball.vx) * 0.6 + boost * 0.7);
      ball.vy = (ay !== 0 ? ay : (ball.vy >= 0 ? -1 : 1)) * 35 + ball.vy * 0.5;

      // Limita velocidad máxima para que sea jugable
      const maxSpeed = 720;
      const spd = Math.hypot(ball.vx, ball.vy);
      if (spd > maxSpeed) {
        ball.vx = (ball.vx / spd) * maxSpeed;
        ball.vy = (ball.vy / spd) * maxSpeed;
      }
      sumarPunto();
    }

    // Sensor de movimiento del celular
    let lastShake = 0;
    function onMotion(e) {
      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;
      const x = acc.x || 0;
      const y = acc.y || 0;
      const z = acc.z || 0;
      const delta = Math.hypot(x, y, z) - 9.81;
      const now = performance.now();
      if (Math.abs(delta) > 6.5 && now - lastShake > 180) {
        lastShake = now;
        golpearDesdeMovimiento(x, -y);
      }
    }

    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      const btn = document.getElementById("btnSensor");
      btn.style.display = "inline-block";
      btn.addEventListener("click", async () => {
        try {
          const res = await DeviceMotionEvent.requestPermission();
          if (res === "granted") {
            addEventListener("devicemotion", onMotion);
            btn.style.display = "none";
          }
        } catch (_) {}
      });
    } else if ("DeviceMotionEvent" in window) {
      addEventListener("devicemotion", onMotion);
    }

    // Respaldo con toque en pantalla para golpear/impulsar hacia la derecha
    c.addEventListener("pointerdown", e => {
      const rect = c.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const py = e.clientY - rect.top;
      if (ball) {
        const dx = ball.x - px;
        const dy = ball.y - py;
        const len = Math.hypot(dx, dy) || 1;
        ball.vx = (dx / len) * 420;
        ball.vy = (dy / len) * 420;
        flash = 0.2;
        sumarPunto();
      } else if (conn && conn.open) {
        conn.send({ type: "GOLPE", ax: 12, ay: -4 });
      }
    });

    const peer = new Peer(SALA_ID);
    peer.on("connection", p => {
      conn = p;
      conn.on("open", () => {
        document.getElementById("st").textContent = "Conectado";
        if (!ball) {
          ball = { x: c.width * 0.3, y: c.height * 0.5, vx: 260, vy: 180 };
        }
      });
      conn.on("data", msg => {
        if (!msg || typeof msg !== "object") return;
        if (msg.type === "PASE_IZQ") {
          ball = {
            x: c.width - r - 2,
            y: Math.max(r, Math.min(c.height - r, msg.ny * c.height)),
            vx: -Math.max(220, Math.abs(msg.vx)),
            vy: msg.vy
          };
        } else if (msg.type === "GOLPE" && ball) {
          ball.vx = -Math.abs(ball.vx || 260) - 140;
          ball.vy += (msg.ay || 0) * 18;
          flash = 0.25;
        }
      });
      conn.on("close", () => {
        document.getElementById("st").textContent = "Desconectado";
      });
    });

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;

      ctx.fillStyle = flash > 0 ? "#172554" : "#0f172a";
      if (flash > 0) flash = Math.max(0, flash - dt);
      ctx.fillRect(0, 0, c.width, c.height);

      if (ball) {
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Rebote arriba y abajo
        if (ball.y - r < 0) {
          ball.y = r;
          ball.vy = Math.abs(ball.vy);
        } else if (ball.y + r > c.height) {
          ball.y = c.height - r;
          ball.vy = -Math.abs(ball.vy);
        }

        // Rebote en borde izquierdo (si no hay conexión, rebota; si está conectado y va a la izq, rebota)
        if (ball.x - r < 0) {
          ball.x = r;
          ball.vx = Math.abs(ball.vx);
        }

        // Si sale por la derecha y hay conexión, pasa al celular derecho
        if (ball.x - r > c.width) {
          if (conn && conn.open) {
            conn.send({
              type: "PASE_DER",
              ny: ball.y / Math.max(1, c.height),
              vx: ball.vx,
              vy: ball.vy
            });
            ball = null;
          } else {
            ball.x = c.width - r;
            ball.vx = -Math.abs(ball.vx);
          }
        }

        if (ball) {
          ctx.fillStyle = "#38bdf8";
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
